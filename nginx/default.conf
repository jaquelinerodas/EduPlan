# =============================================================================
#  EduPlan · Nginx (proxy inverso)
#  Punto único de entrada (RF10):
#    /        -> frontend (archivos estáticos)
#    /auth/   -> ms-auth:3001
#    /api/    -> ms-academico:3002
#  Fase 4: HTTP en el puerto 80. En la Fase 5 se agrega HTTPS (443).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Datos comunes que reciben los microservicios
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- Microservicio 1: autenticación ----------
    location /auth/ {
        proxy_pass http://ms-auth:3001;
    }

    # ---------- Microservicio 2: académico e IA ----------
    location /api/ {
        proxy_pass http://ms-academico:3002;
        # Las respuestas de la IA pueden tardar varios segundos
        proxy_read_timeout 60s;
    }

    # ---------- Frontend ----------
    location /fuentes/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(css|js|svg)$ {
        # Revalida en cada visita para que los cambios se vean de inmediato
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
