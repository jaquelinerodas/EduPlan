
#  EduPlan · docker-compose.yml
#  FASE 4: PostgreSQL + ms-auth + ms-academico + nginx (con el frontend).
#  Entrada única: http://localhost  (Nginx enruta /auth y /api)
#  En la Fase 5 se agrega HTTPS y se cierran los puertos 3001/3002.

name: eduplan

services:
  
  postgres:
    image: postgres:16-alpine
    container_name: eduplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MS_AUTH_DB_PASSWORD: ${MS_AUTH_DB_PASSWORD}
      MS_ACADEMICO_DB_PASSWORD: ${MS_ACADEMICO_DB_PASSWORD}
      TZ: America/Guatemala
      PGTZ: America/Guatemala
    volumes:
      - pgdata:/var/lib/postgresql/data
      
      - ./database/init:/docker-entrypoint-initdb.d:ro
   
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduplan-net


  # Microservicio 1: autenticación y usuarios
  
  ms-auth:
    build: ./ms-auth
    container_name: eduplan-ms-auth
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: ${MS_AUTH_DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      FRONTEND_URL: ${FRONTEND_URL}
      TZ: America/Guatemala
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eduplan-net

 
  # Microservicio 2: materias, tareas, apuntes e IA
 
  ms-academico:
    build: ./ms-academico
    container_name: eduplan-ms-academico
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: ${MS_ACADEMICO_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      TZ: America/Guatemala
    depends_on:
      postgres:
        condition: service_healthy
    
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eduplan-net

  
  # Proxy inverso + frontend (único servicio pensado para el exterior)
  
  nginx:
    image: nginx:1.27-alpine
    container_name: eduplan-nginx
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-academico:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - eduplan-net

volumes:
  pgdata:
    name: eduplan_pgdata

networks:
  eduplan-net:
    name: eduplan-net
