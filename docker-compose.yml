# =============================================================================
#  EduPlan · docker-compose.yml
#  FASE 5: HTTPS y puertos internos cerrados.
#   - Entrada única: https://localhost (Nginx). http://localhost redirige a https.
#   - ms-auth, ms-academico y PostgreSQL NO publican puertos: solo se llega a
#     ellos a través de Nginx (y a la base solo desde los microservicios).
#   - Para desarrollo (DBeaver, probar un microservicio directo) usa:
#       docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================
name: eduplan

# Rotación de logs para que no llenen el disco
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Base de datos compartida (solo en la red "datos", que no tiene salida)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eduplan-postgres
    restart: unless-stopped
    <<: *logs
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MS_AUTH_DB_PASSWORD: ${MS_AUTH_DB_PASSWORD}
      MS_ACADEMICO_DB_PASSWORD: ${MS_ACADEMICO_DB_PASSWORD}
      TZ: America/Guatemala
      PGTZ: America/Guatemala
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts de esta carpeta se ejecutan en orden alfabético
      # SOLO la primera vez (cuando el volumen está vacío).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datos

  # ---------------------------------------------------------------------------
  # Microservicio 1: autenticación y usuarios
  # ---------------------------------------------------------------------------
  ms-auth:
    build: ./ms-auth
    container_name: eduplan-ms-auth
    restart: unless-stopped
    <<: *logs
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: ${MS_AUTH_DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      FRONTEND_URL: ${FRONTEND_URL}
      TZ: America/Guatemala
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    # Endurecimiento: sistema de archivos de solo lectura y sin escalar privilegios
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/auth/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - interna   # Nginx y salida a internet (Google OAuth)
      - datos     # PostgreSQL

  # ---------------------------------------------------------------------------
  # Microservicio 2: materias, tareas, apuntes e IA
  # ---------------------------------------------------------------------------
  ms-academico:
    build: ./ms-academico
    container_name: eduplan-ms-academico
    restart: unless-stopped
    <<: *logs
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: ${MS_ACADEMICO_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      TZ: America/Guatemala
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - interna   # Nginx y salida a internet (API de IA)
      - datos     # PostgreSQL

  # ---------------------------------------------------------------------------
  # Proxy inverso + frontend: el ÚNICO servicio con puertos publicados
  # ---------------------------------------------------------------------------
  nginx:
    build: ./nginx
    container_name: eduplan-nginx
    restart: unless-stopped
    <<: *logs
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/acme:/var/www/acme:ro
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-academico:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - interna

volumes:
  pgdata:
    name: eduplan_pgdata

networks:
  # Nginx <-> microservicios (con salida a internet para Google y la IA)
  interna:
    name: eduplan-interna
  # Microservicios <-> PostgreSQL. "internal" = sin salida ni entrada desde fuera
  datos:
    name: eduplan-datos
    internal: true
